name: Vinted Flipper
version: "0.1.1"
slug: vinted_flipper
description: Repère sur Vinted les articles revendables plus cher
url: https://github.com/AndroFlo/resale-finder
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:tag-search
panel_title: Vinted
homeassistant_api: true
map:
  - addon_config:rw
options:
  scan_interval_minutes: 60
  max_pages: 3
  recheck_hours: 24
  max_checks_per_cycle: 25
  min_margin: 8.0
  min_margin_pct: 25.0
  max_days_to_sell: 45.0
  notify_service: ""
  notify_min_margin: 15.0
  min_delay: 6.0
  max_delay: 12.0
  log_level: INFO
schema:
  scan_interval_minutes: int(15,1440)
  max_pages: int(1,20)
  recheck_hours: int(1,168)
  max_checks_per_cycle: int(5,200)
  min_margin: float(0,)
  min_margin_pct: float(0,)
  max_days_to_sell: float(0,)
  notify_service: str?
  notify_min_margin: float(0,)
  min_delay: float(0.5,)
  max_delay: float(1,)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
